# encoding: utf-8
# 這個檔案會覆蓋 default.yaml 的設定
customization:
  distribution_code_name: Weasel
  distribution_version: 0.17.4
  generator: "Rime::SwitcherSettings"
  modified_time: "Wed Oct 15 05:33:33 2025"
  rime_version: 1.13.1
patch:
  # 設定順序很重要
  "ascii_composer/switch_key":
    Caps_Lock: commit_text
    Shift_L: commit_code # 設定 commit_code →輸出英文並切換為英文
    Shift_R: commit_text # 設定 commit_text →輸出中文並切換為英文
    # Shift_L 設定 inline_ascii →不切換中英也不輸出, 行內編輯英文
  "key_binder/bindings":
    - {accept: "Control+p", send: Up, when: composing}
    - {accept: "Control+n", send: Down, when: composing}
    - {accept: "Control+b", send: Left, when: composing}
    - {accept: "Control+f", send: Right, when: composing}
    - {accept: "Control+a", send: Home, when: composing}
    - {accept: "Control+e", send: End, when: composing}
    - {accept: "Control+d", send: Delete, when: composing}
    - {accept: "Control+k", send: "Shift+Delete", when: composing}
    - {accept: "Control+h", send: BackSpace, when: composing}
    - {accept: "Control+g", send: Escape, when: composing}
    - {accept: "Alt+v", send: Page_Up, when: composing}
    - {accept: "Control+v", send: Page_Down, when: composing}
    - {accept: ISO_Left_Tab, send: "Shift+Left", when: composing}
    - {accept: "Shift+Tab", send: "Shift+Left", when: composing}
    - {accept: Tab, send: "Shift+Right", when: composing}
    - {accept: minus, send: Page_Up, when: has_menu}
    - {accept: equal, send: Page_Down, when: has_menu}
    - {accept: comma, send: Page_Up, when: paging}
    - {accept: period, send: Page_Down, when: has_menu}
    - {accept: "Control+Shift+1", select: .next, when: always}
    - {accept: "Control+Shift+2", toggle: ascii_mode, when: always}
    - {accept: "Control+Shift+3", toggle: full_shape, when: always}
    - {accept: "Control+Shift+4", toggle: ascii_punct, when: always}
    - {accept: "Control+Shift+5", toggle: simplification, when: always}
    - {accept: "Control+Shift+6", toggle: extended_charset, when: always}
    - {accept: "Control+Shift+exclam", select: .next, when: always}
    - {accept: "Control+Shift+at", toggle: ascii_mode, when: always}
    - {accept: "Control+Shift+numbersign", toggle: full_shape, when: always}
    - {accept: "Control+Shift+dollar", toggle: ascii_punct, when: always}
    - {accept: "Control+Shift+percent", toggle: simplification, when: always}
    - {accept: "Control+Shift+asciicircum", toggle: extended_charset, when: always}
    - {accept: "Shift+space", toggle: ascii_mode, when: always}
    - {accept: "Control+comma", set_option: ascii_mode, when: always}
    - {accept: "Control+period", set_option: full_shape, when: always}
    - {accept: "Control+slash", set_option: ascii_punct, when: always}
    - {accept: "Control+Shift+comma", unset_option: ascii_mode, when: always}
    - {accept: "Control+Shift+period", unset_option: full_shape, when: always}
    - {accept: "Control+Shift+slash", unset_option: ascii_punct, when: always}
    - {accept: "Control+Shift+less", unset_option: ascii_mode, when: always}
    - {accept: "Control+Shift+greater", unset_option: full_shape, when: always}
    - {accept: "Control+Shift+question", unset_option: ascii_punct, when: always}
  schema_list:
    - {schema: sucang}
    - {schema: luna_pinyin_fluency}
    - {schema: cangjie5_express}
    - {schema: luna_pinyin_tw}
    - {schema: bopomofo_tw}
  "switcher/fix_schema_list_order": true
  "switcher/hotkeys":
    # caption: "[ 輸入法選單 ]" # 這行不對, 會當掉
    - "Control+grave"       # Ctrl + `
    - "Control+Shift+grave" # Ctrl + Shift + `
    - F4